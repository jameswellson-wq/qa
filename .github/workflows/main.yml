name: Build version.dll

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: false

jobs:
  build:
    name: Build (Debug + Release | x64)
    runs-on: windows-latest

    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 初始化 MSBuild 环境
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 3. 打印构建环境信息
      - name: Print build environment
        shell: pwsh
        run: |
          Write-Host "===== Runner Environment ====="
          Write-Host "OS       : $env:RUNNER_OS / $env:ImageOS $env:ImageVersion"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host ""
          Write-Host "===== MSBuild Version ====="
          msbuild -version
          Write-Host ""
          Write-Host "===== MSVC Toolset ====="
          $vcBase = "C:\Program Files\Microsoft Visual Studio"
          Get-ChildItem "$vcBase\*\*\VC\Tools\MSVC" -ErrorAction SilentlyContinue |
            Get-ChildItem -Directory |
            ForEach-Object { Write-Host "  Toolset: $($_.Name) @ $($_.FullName)" }
          Write-Host ""
          Write-Host "===== Windows SDK ====="
          $sdkBase = "C:\Program Files (x86)\Windows Kits\10\bin"
          if (Test-Path $sdkBase) {
            Get-ChildItem $sdkBase -Directory |
              Where-Object { $_.Name -match '^\d+\.' } |
              ForEach-Object { Write-Host "  SDK: $($_.Name)" }
          }
          Write-Host ""
          Write-Host "===== Source Files ====="
          Get-ChildItem -File | ForEach-Object {
            Write-Host ("  {0,-45} {1,8} bytes  {2}" -f $_.Name, $_.Length, $_.LastWriteTimeUtc.ToString("u"))
          }

      # 4. 编译 Debug 版本
      - name: Build Debug
        shell: pwsh
        run: |
          msbuild version.sln `
            /p:Configuration=Debug `
            /p:Platform=x64 `
            /p:VisualStudioVersion=17.0 `
            /m `
            /nologo `
            /verbosity:minimal `
            /flp:"LogFile=build-debug.log;Verbosity=detailed;Encoding=UTF-8"

      # 5. 编译 Release 版本
      - name: Build Release
        shell: pwsh
        run: |
          msbuild version.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:VisualStudioVersion=17.0 `
            /m `
            /nologo `
            /verbosity:minimal `
            /flp:"LogFile=build-release.log;Verbosity=detailed;Encoding=UTF-8"

      # 6. DLL 导出表验证 (dumpbin)
      - name: Verify DLL exports
        if: always()
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" `
            -Recurse -Filter "dumpbin.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) {
            Write-Host "dumpbin.exe not found, skipping export check"
            exit 0
          }
          foreach ($cfg in @("Debug","Release")) {
            $dll = "build\$cfg\x64\version.dll"
            if (-not (Test-Path $dll)) {
              Write-Host "[$cfg] version.dll not found, skipping"
              continue
            }
            Write-Host ""
            Write-Host "===== [$cfg] version.dll — File Info ====="
            $fi = Get-Item $dll
            Write-Host ("  Size: {0:N0} bytes  Modified: {1}" -f $fi.Length, $fi.LastWriteTimeUtc.ToString("u"))
            Write-Host ""
            Write-Host "===== [$cfg] EXPORTS (dumpbin /EXPORTS) ====="
            & $dumpbin /EXPORTS $dll 2>&1 | ForEach-Object { Write-Host "  $_" }
            Write-Host ""
            Write-Host "===== [$cfg] HEADERS summary (dumpbin /HEADERS) ====="
            & $dumpbin /HEADERS $dll 2>&1 |
              Where-Object { $_ -match 'machine|subsystem|characteristics|size of image|DLL' } |
              ForEach-Object { Write-Host "  $_" }
          }

      # 7. 上传 Debug 构件
      - name: Upload Debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: version-dll-debug-x64
          path: build/Debug/x64/version.dll
          if-no-files-found: warn
          retention-days: 7

      # 8. 上传 Release 构件
      - name: Upload Release artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: version-dll-release-x64
          path: build/Release/x64/version.dll
          if-no-files-found: warn
          retention-days: 30

      # 9. 合并并上传完整日志
      - name: Merge and upload build logs
        if: always()
        shell: pwsh
        run: |
          $header = "=" * 64
          $merged = @()
          $merged += $header
          $merged += "version.dll Build Log — $env:GITHUB_RUN_ID  Run#$env:GITHUB_RUN_NUMBER"
          $merged += "Triggered by: $env:GITHUB_EVENT_NAME  Ref: $env:GITHUB_REF"
          $merged += "Commit: $env:GITHUB_SHA"
          $merged += $header
          $merged += ""
          foreach ($cfg in @("debug","release")) {
            $file = "build-$cfg.log"
            if (Test-Path $file) {
              $merged += "=" * 64
              $merged += "[$($cfg.ToUpper())] $file"
              $merged += "=" * 64
              $merged += Get-Content $file
              $merged += ""
            }
          }
          $merged | Out-File -FilePath "build-all.log" -Encoding UTF8
          Write-Host "Merged log: $(($merged).Count) lines"

      - name: Upload merged log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build-all.log
          retention-days: 14

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Release artifact
        uses: actions/download-artifact@v4
        with:
          name: version-dll-release-x64
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/version.dll
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
