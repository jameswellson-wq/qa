name: Build version.dll

# ─────────────────────────────────────────────
# 触发条件
# ─────────────────────────────────────────────
on:
  push:
    branches: [ main, master ]
    # 推送 vX.Y.Z 格式的 tag → 触发 Release 发布
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]
  # 手动触发
  workflow_dispatch:

# ─────────────────────────────────────────────
# 修复问题1：Node 弃用警告
# 明确声明使用 Node 24，消除 Node 20 弃用提示
# ─────────────────────────────────────────────
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: false

jobs:

  # ═══════════════════════════════════════════
  # 修复问题2：原来 Debug / Release 是两个并行 Job
  # 实际上它们都需要 MSBuild 环境初始化（最耗时）
  # 合并成一个 Job，串行编译两个配置
  # 节省约 2-3 分钟的 runner 冷启动和 VS 初始化时间
  # ═══════════════════════════════════════════
  build:
    name: Build (Debug + Release | x64)
    runs-on: windows-latest

    steps:
      # ── 1. 拉代码 ──────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. 初始化 MSVC 环境（只做一次） ────
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ── 3. 编译 Debug ──────────────────────
      - name: Build Debug
        shell: pwsh
        run: |
          msbuild version.sln `
            /p:Configuration=Debug `
            /p:Platform=x64 `
            /p:VisualStudioVersion=17.0 `
            /m `
            /nologo `
            /verbosity:minimal `
            /flp:"LogFile=build-debug.log;Verbosity=normal;Encoding=UTF-8"
          # 修复问题1：verbosity 分离
          #   控制台用 minimal（只看警告/错误）
          #   文件用 normal（保留足够诊断信息，去掉 diagnostic 的属性展开噪音）

      # ── 4. 编译 Release ────────────────────
      - name: Build Release
        shell: pwsh
        run: |
          msbuild version.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:VisualStudioVersion=17.0 `
            /m `
            /nologo `
            /verbosity:minimal `
            /flp:"LogFile=build-release.log;Verbosity=normal;Encoding=UTF-8"

      # ── 5. 上传 Debug 产物 ─────────────────
      - name: Upload Debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: version-dll-debug-x64
          # 修复问题3：输出路径与 vcxproj 的 OutDir 保持一致
          path: build/Debug/x64/version.dll
          if-no-files-found: error
          retention-days: 7

      # ── 6. 上传 Release 产物 ───────────────
      - name: Upload Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: version-dll-release-x64
          path: build/Release/x64/version.dll
          if-no-files-found: error
          retention-days: 30

      # ── 7. 上传合并日志 ────────────────────
      # 修复问题1：两份日志合并上传，不再各自独立 Job 收集
      - name: Merge and upload build logs
        if: always()   # 编译失败也要收日志
        shell: pwsh
        run: |
          $header = "=" * 64
          $merged = @()
          $merged += $header
          $merged += "version.dll Build Log — $env:GITHUB_RUN_ID  Run#$env:GITHUB_RUN_NUMBER"
          $merged += "Triggered by: $env:GITHUB_EVENT_NAME  Ref: $env:GITHUB_REF"
          $merged += $header
          $merged += ""

          foreach ($cfg in @("debug","release")) {
            $file = "build-$cfg.log"
            if (Test-Path $file) {
              $merged += "=" * 64
              $merged += "[$($cfg.ToUpper())] $file"
              $merged += "=" * 64
              $merged += Get-Content $file
              $merged += ""
            }
          }

          $merged | Out-File -FilePath "build-all.log" -Encoding UTF8
          Write-Host "Merged log: $(($merged).Count) lines"

      - name: Upload merged log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build-all.log
          retention-days: 14

  # ═══════════════════════════════════════════
  # Release 发布 Job（仅在推送 tag 时触发）
  # 依赖 build Job 完成后的 artifact
  # ═══════════════════════════════════════════
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    # 只在 tag push 时运行
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Release artifact
        uses: actions/download-artifact@v4
        with:
          name: version-dll-release-x64
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/version.dll
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
